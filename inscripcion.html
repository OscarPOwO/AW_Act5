<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción - TechAcademy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/miEstilo.css">
</head>
<body>
    <header>
        <div id="logo">
            <h1>TechAcademy</h1>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="mentoria.html">Mentoría</a></li>
                <li><a href="inscripcion.html" class="btn_destacado">Inscribirse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inscripcion">
            <h2>Inscríbete a un curso</h2>
            <p class="descripcion_pagina">Llena el formulario y reserva tu lugar.</p>

                <form class="formulario" action="#" method="GET">
                <label for="nombre">Nombre completo:</label>
                <input type="text" name="nombre" id="nombre" placeholder="Ingresa tu nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" name="correo" id="correo" placeholder="tucorreo@ejemplo.com" required>

                <label for="curso">Curso:</label>
                <select name="curso" id="curso" required>
                    <option value="" disabled selected>Selecciona un curso</option>
                    <option value="frontend">Desarrollo Web FrontEnd</option>
                    <option value="python">Python para Ciencia de Datos</option>
                    <option value="bases-datos">Bases de Datos Robustas</option>
                    <option value="backend">Programación Backend con APIs</option>
                </select>

                <label for="nivel">Tu nivel actual:</label>
                <select name="nivel" id="nivel">
                    <option value="principiante">Principiante</option>
                    <option value="intermedio">Intermedio</option>
                    <option value="avanzado">Avanzado</option>
                </select>

                <label class="check">
                    <input type="checkbox" name="terminos" required>
                    Acepto los términos y condiciones
                </label>

                <button type="submit" class="btn_accion">Inscribirme</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TechAcademy</p>
    </footer>
</body>
</html>
